# Deploy pure-static frontend to GitHub Pages.
# The Render backend URL is NOT stored in code: it lives in the repository
# Secret RENDER_BACKEND_URL and is injected here at deploy time, replacing
# the __RENDER_BACKEND_URL__ placeholder in index.html.
#
# One-time repo setup (owner does this once):
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name:  RENDER_BACKEND_URL
#      Value: https://<your-service>.onrender.com   (no trailing slash)
#   2. Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject RENDER_BACKEND_URL secret into placeholder
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "::warning::Secret RENDER_BACKEND_URL is empty; Render option will show as unconfigured."
          fi
          sed -i 's|__RENDER_BACKEND_URL__|${{ secrets.RENDER_BACKEND_URL }}|g' index.html
          grep -n "RENDER_BACKEND_URL:" index.html | head -2
          test -d . && mkdir -p dist && cp index.html .nojekyll dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
