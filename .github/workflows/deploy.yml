# Deploy pure-static frontend to GitHub Pages.
# Backend URLs are NOT stored in code: they live in repository Secrets and are
# injected here at deploy time, replacing the __*_BACKEND_URL__ placeholders.
#
# One-time repo setup (owner does this once):
#   1. Settings → Secrets and variables → Actions → New repository secret
#      Name:  RENDER_BACKEND_URL            Value: https://<service>.onrender.com
#      Name:  SELF_HOST_BACKEND_URL         Value: https://<self-hosted-domain>
#      Name:  SELF_HOST_BACKEND_BACKUP_URL  Value: https://<backup-domain>
#      (no trailing slash)
#   2. Settings → Pages → Build and deployment → Source: GitHub Actions
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject backend URL secrets into placeholders
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_URL }}" ]; then
            echo "::warning::Secret RENDER_BACKEND_URL is empty; Render option will show as unconfigured."
          fi
          if [ -z "${{ secrets.SELF_HOST_BACKEND_URL }}" ]; then
            echo "::warning::Secret SELF_HOST_BACKEND_URL is empty; Self-host-by-lei option will show as unconfigured."
          fi
          if [ -z "${{ secrets.SELF_HOST_BACKEND_BACKUP_URL }}" ]; then
            echo "::warning::Secret SELF_HOST_BACKEND_BACKUP_URL is empty; Self-host-by-lei-backup option will show as unconfigured."
          fi
          sed -i 's|__RENDER_BACKEND_URL__|${{ secrets.RENDER_BACKEND_URL }}|g' index.html
          sed -i 's|__SELF_HOST_BACKEND_URL__|${{ secrets.SELF_HOST_BACKEND_URL }}|g' index.html
          sed -i 's|__SELF_HOST_BACKEND_BACKUP_URL__|${{ secrets.SELF_HOST_BACKEND_BACKUP_URL }}|g' index.html
          grep -n "BACKEND_URL:" index.html | head -6
          mkdir -p dist && cp index.html .nojekyll dist/
          cp CNAME dist/ 2>/dev/null || echo "no CNAME file, skipping (custom domain not set)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
